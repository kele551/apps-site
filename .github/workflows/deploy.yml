name: 发布到 Cloudflare Pages

# push 到 main → 自动发布到 https://kele551-apps.pages.dev/
# 只有下面这几个文件变了才触发，改文档不会白跑一次部署。

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "og-cover.png"
      - "og-cover.png"
      - "tools/deploy_pages.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:      # 也可以在 Actions 页面手动点一次

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --quiet blake3

      - name: 上传并发布（含回读校验）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/deploy_pages.py --apply

      - name: 发布后摘要
        if: always()
        run: |
          echo "站点：https://kele551-apps.pages.dev/"
          echo "部署详情：dash.cloudflare.com → Workers 和 Pages → kele551-apps"
